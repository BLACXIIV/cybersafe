# Installed to /etc/dnsmasq.d/cybersafe-ap.conf by setup_ap.sh.
# Only serves wlan0 (the AP interface) — never touches eth0 or the Pi's
# own DNS resolution on lo, so it can't collide with systemd-resolved.

interface=wlan0
bind-interfaces
except-interface=lo

# DHCP pool handed to students' devices. .1 is the Pi itself, .2-.49 left
# free for anything you want to give a fixed address later.
dhcp-range=10.42.0.50,10.42.0.200,255.255.255.0,12h
dhcp-option=3,10.42.0.1   # default gateway = the Pi
dhcp-option=6,10.42.0.1   # DNS server = the Pi (dnsmasq below)

# So students can reach the app at http://cybersafe.local:8000 as well as
# the raw IP, even before they've earned/redeemed a voucher.
address=/cybersafe.local/10.42.0.1

# Upstream DNS for actual internet lookups (only matters once a device is
# in voucher_allow — the firewall still blocks the rest of their traffic).
no-resolv
server=1.1.1.1
server=8.8.8.8

domain-needed
bogus-priv
