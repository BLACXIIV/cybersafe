# Installed to /etc/systemd/system/dnsmasq.service.d/override.conf by setup_ap.sh.
#
# The query log keeps coming out unreadable to the pi-user site-visits daemon:
# a restrictive umask on fresh creation, and a plain restart reopens/recreates
# the file and re-tightens the bits. UMask alone wasn't enough, so normalize
# the mode after every start — deterministic regardless of how dnsmasq
# handles the file internally. logrotate's `create 0644` covers rotations.
[Service]
UMask=0022
ExecStartPost=/bin/chmod 644 /var/log/cybersafe-dns.log
