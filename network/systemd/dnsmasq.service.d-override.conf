# Installed to /etc/systemd/system/dnsmasq.service.d/override.conf by setup_ap.sh.
#
# The stock unit runs dnsmasq with a tight umask, so the query log comes out
# 0640/0600 and the pi-user site-visits daemon (and admin app) can't read it.
# 0022 = the normal default: new log files are 0644, readable by the daemon —
# no manual chmod, no group juggling. logrotate's `create 0644` covers rotated
# files; this covers files dnsmasq creates itself.
[Service]
UMask=0022
