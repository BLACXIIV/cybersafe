# Installed to /etc/hostapd/hostapd.conf by setup_ap.sh.
# CHANGE ssid AND wpa_passphrase BEFORE running setup_ap.sh.

interface=wlan0
driver=nl80211

ssid=CyberSAFE-School
hw_mode=g
channel=6
country_code=PH
ieee80211d=1

wmm_enabled=1
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0

wpa=2
wpa_passphrase=ChangeThisPassword123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP
